services:
  - type: web
    name: azzuro-trial-review-api
    runtime: python
    plan: free
    repo: https://github.com/Eshwar02/azzuro-trial.git
    branch: main
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python server.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/dashboard
